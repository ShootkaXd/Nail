services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-24h}"
      PORT: "3000"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      NODE_ENV: "production"
      UPLOAD_DIR: "/app/data/uploads"
      # Cosmetic only (log timestamps) — slot/working-hours math is timezone-independent,
      # it computes the Europe/Moscow offset explicitly (see backend/src/services/slot.service.ts).
      TZ: "Europe/Moscow"
    volumes:
      - db-data:/app/data
    expose:
      - "3000"
    healthcheck:
      # node-based check: wget/curl are not present in the slim image
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"

  # Reverse proxy with automatic Let's Encrypt HTTPS. Opt-in: only starts
  # with `docker compose --profile https up -d`. Requires DOMAIN in .env
  # pointing (via DNS A record) at this server, and ports 80/443 open.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Soft default (not ":?required") — compose validates every service's
      # interpolations at parse time even when its profile isn't active, so
      # a hard-required var here would break plain `docker compose up -d`
      # for users who never opt into the https profile. If DOMAIN is unset
      # and you do start this profile, Caddy will just fail to get a real
      # cert for "localhost" — visible in `docker compose logs caddy`.
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
